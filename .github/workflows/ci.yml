name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          working-directory: pokedex-aspire.VisionService
          enable-cache: true
          cache-dependency-glob: pokedex-aspire.VisionService/uv.lock

      - name: Restore locked Python environment
        working-directory: pokedex-aspire.VisionService
        run: uv sync --locked

      - name: Run Python tests
        working-directory: pokedex-aspire.VisionService
        run: uv run --frozen python -m unittest discover -s tests -v

      - name: Restore .NET dependencies
        run: dotnet restore pokedex-aspire.sln

      - name: Build .NET solution
        run: dotnet build pokedex-aspire.sln --configuration Release --no-restore

      - name: Run .NET distributed tests
        run: >-
          dotnet test pokedex-aspire.Tests/pokedex-aspire.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload .NET test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-test-results
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14